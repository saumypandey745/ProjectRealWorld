; ==============================================================================
; Project RealWorld - Lightweight Development Mode Configuration
; Purpose: Allows engineer execution on systems with integrated Intel HD graphics
; Usage: Pass to UnrealEngine as: -ini:Scalability:Scalability_DevLow
; Or execute in console: "exec Config/Scalability_DevLow.ini"
; ==============================================================================

[ScalabilitySettings]
sg.ViewDistanceQuality=0
sg.AntiAliasingQuality=0
sg.ShadowQuality=0
sg.GlobalIlluminationQuality=0
sg.ReflectionQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=0
sg.EffectsQuality=0
sg.FoliageQuality=0
sg.ShadingQuality=0

[ConsoleVariables]
r.Nanite=0
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.ShadowQuality=1
r.Shadow.CSM.MaxCascades=1
r.DistanceFieldShadowing=0
r.DistanceFieldAO=0
r.Lumen.DiffuseIndirect.Allow=0
r.RayTracing=0
r.DefaultFeature.MotionBlur=0
r.DefaultFeature.AutoExposure=0
r.TemporalAA.Upscaling=0
r.AntiAliasingMethod=1
r.SkinCache.CompileShaders=0
r.HairStrands.Enable=0
r.Streaming.PoolSize=1000
