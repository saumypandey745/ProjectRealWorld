; ==============================================================================
; Project RealWorld - Android Mobile Scalability Profiles
; Supports Mobile Low (budget 30 FPS), Mobile Medium, and Mobile High (flagship 60 FPS)
; ==============================================================================

; --- VIEW DISTANCE ---
[ViewDistanceQuality@0] ; Mobile Low
r.ViewDistanceScale=0.4
foliage.DensityScale=0.15
r.StaticMeshLODDistanceScale=1.6

[ViewDistanceQuality@1] ; Mobile Medium
r.ViewDistanceScale=0.55
foliage.DensityScale=0.3
r.StaticMeshLODDistanceScale=1.3

[ViewDistanceQuality@2] ; Mobile High
r.ViewDistanceScale=0.75
foliage.DensityScale=0.5
r.StaticMeshLODDistanceScale=1.1

[ViewDistanceQuality@3] ; Mobile Ultra/Tablet
r.ViewDistanceScale=0.9
foliage.DensityScale=0.7
r.StaticMeshLODDistanceScale=1.0

; --- SHADOWS ---
[ShadowQuality@0] ; Mobile Low
r.ShadowQuality=0
r.Shadow.CSM.MaxCascades=0
r.Shadow.MaxResolution=512

[ShadowQuality@1] ; Mobile Medium
r.ShadowQuality=1
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=1024

[ShadowQuality@2] ; Mobile High
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024

[ShadowQuality@3] ; Mobile Ultra
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=3
r.Shadow.MaxResolution=2048

; --- EFFECTS & PARTICLES ---
[EffectsQuality@0]
r.Niagara.QualityLevel=0
fx.MaxCPUParticlesPerEmitter=80
fx.MaxGPUParticlesSpawnedPerFrame=400

[EffectsQuality@1]
r.Niagara.QualityLevel=0
fx.MaxCPUParticlesPerEmitter=150
fx.MaxGPUParticlesSpawnedPerFrame=800

[EffectsQuality@2]
r.Niagara.QualityLevel=1
fx.MaxCPUParticlesPerEmitter=300
fx.MaxGPUParticlesSpawnedPerFrame=1500

[EffectsQuality@3]
r.Niagara.QualityLevel=2
fx.MaxCPUParticlesPerEmitter=600
fx.MaxGPUParticlesSpawnedPerFrame=3000

; --- POST PROCESSING ---
[PostProcessQuality@0]
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.DepthOfFieldQuality=0
r.BloomQuality=0

[PostProcessQuality@1]
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.DepthOfFieldQuality=0
r.BloomQuality=1

[PostProcessQuality@2]
r.MotionBlurQuality=1
r.AmbientOcclusionLevels=1
r.DepthOfFieldQuality=1
r.BloomQuality=2

[PostProcessQuality@3]
r.MotionBlurQuality=1
r.AmbientOcclusionLevels=1
r.DepthOfFieldQuality=1
r.BloomQuality=3

; --- TEXTURE QUALITY ---
[TextureQuality@0]
r.Streaming.MipBias=2
r.MaxAnisotropy=0

[TextureQuality@1]
r.Streaming.MipBias=1
r.MaxAnisotropy=2

[TextureQuality@2]
r.Streaming.MipBias=0
r.MaxAnisotropy=4

[TextureQuality@3]
r.Streaming.MipBias=0
r.MaxAnisotropy=8

; --- RESOLUTION MODES (720p, 1080p, 2K, 4K) ---
[ResolutionQuality@0] ; 720p HD (High Performance / Battery Saver)
r.ScreenPercentage=67
r.TSR.History.ScreenPercentage=67
r.TSR.Quality=1

[ResolutionQuality@1] ; 1080p Full HD (Balanced AAA - Default)
r.ScreenPercentage=100
r.TSR.History.ScreenPercentage=100
r.TSR.Quality=2

[ResolutionQuality@2] ; 2K QHD (1440p Flagship Mobile)
r.ScreenPercentage=133
r.TSR.History.ScreenPercentage=133
r.TSR.Quality=3

[ResolutionQuality@3] ; 4K UHD (2160p Ultra Photorealism)
r.ScreenPercentage=200
r.TSR.History.ScreenPercentage=200
r.TSR.Quality=4
