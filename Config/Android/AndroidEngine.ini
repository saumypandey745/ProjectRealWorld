; ==============================================================================
; Project RealWorld — Android Engine Configuration
; Target: 4GB RAM, 64GB Storage, Snapdragon 7xx / Dimensity 700-series+
; Graphics: BGMI/COD Mobile quality — smooth 30-60fps on mid-range devices
; APK Size Target: ~1.5-2.5GB (with PAK streaming)
; ==============================================================================

[PlatformCrypto]
PlatformSymbol=Android

; ─── GRAPHICS API — Vulkan Primary, OpenGL ES fallback ───────────────────────
[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
bBuildForES31=True
bBuildForArm64=True
bBuildForArmV7=False
bBuildForX8664=False
bSupportsVulkan=True
bSupportsVulkanSM5=False
bSupportOpenGLES31=True
PreferredGraphicsAPI=Vulkan

TargetSDKVersion=34
MinSDKVersion=26
Orientation=Landscape
bUseDisplayCutout=True
MaxAspectRatio=2.5
MinimumRequiredMemory=3072

PackageName=com.projectrealworld.game
ApplicationDisplayName=Project RealWorld
VersionDisplayName=1.0.0
StoreVersion=1

; ─── RENDERING — Mobile-optimized (NO Lumen, NO Nanite on low-end) ───────────
[/Script/Engine.RendererSettings]

; Nanite OFF — too heavy for mid-range Android
r.Nanite=0
r.Nanite.ProjectSelectedMeshes=0

; Lumen OFF — use baked GI + SSAO instead (saves 40% GPU)
r.DynamicGlobalIlluminationMethod=0
r.Lumen.HardwareRayTracing=0
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0

; Virtual Shadow Maps OFF — standard CSM shadows
r.Shadow.Virtual.Enable=0
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.RadiusThreshold=0.05

; Screen Space Reflections — cheap, good looking
r.ReflectionMethod=0
r.SSR.Quality=1
r.SSR.MaxRoughness=0.5
r.ReflectionCaptureResolution=128

; Distance Fields — OFF for performance
r.GenerateMeshDistanceFields=0
r.DistanceFieldShadowing=0
r.DistanceFieldAO=0

; Mobile HDR — ON (needed for good visuals)
r.MobileHDR=1
r.Mobile.EnableMovableLightCSMShaderCulling=1
r.Mobile.EnableNoPrecomputedLightingCSMShader=1
r.Mobile.Forward.EnableLocalLights=1
r.Mobile.Forward.EnableClusteredReflections=1

; Upscaling — TSR/FXAA for smooth image
r.AntiAliasingMethod=2
r.ScreenPercentage=75
r.DynamicRes.OperationMode=2
r.DynamicRes.MinScreenPercentage=50
r.DynamicRes.MaxScreenPercentage=100
r.DynamicRes.FrameTimeBudget=33.3

; Post Processing — lightweight
r.BloomQuality=2
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.DepthOfFieldQuality=0
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.AutoExposure.Method=0
r.HairStrands.Enable=0
r.EyeAdaptation.IgnoreOccludersRange=1.0

; ─── TEXTURE & STREAMING ─────────────────────────────────────────────────────
r.Streaming.PoolSize=512
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=1
r.Streaming.MaxTempMemoryAllowed=32
r.MaxAnisotropy=4
r.TextureQuality=1
r.Streaming.HiddenPrimitiveScale=0.5
r.Streaming.UseFixedPoolSize=1

; ─── PARTICLES / VFX ─────────────────────────────────────────────────────────
r.Niagara.QualityLevel=0
fx.MaxCPUParticlesPerEmitter=100
fx.MaxGPUParticlesSpawnedPerFrame=400

; ─── LOD & VIEW DISTANCE ─────────────────────────────────────────────────────
r.ViewDistanceScale=0.55
foliage.DensityScale=0.25
r.StaticMeshLODDistanceScale=1.4
r.MaxLODLevel=1
r.SkeletalMeshLODBias=1

; ─── GPU & CPU BUDGET ────────────────────────────────────────────────────────
r.TiledDeferredShading=1
r.CustomDepth=1
r.SkinCache.CompileShaders=1
r.EarlyZPassMovable=1

; Occlusion culling — saves big draw calls in dense city
r.HZBOcclusion=1
r.OcclusionQueryLocation=1
r.AllowOcclusionQueries=1

; ─── WORLD PARTITION & STREAMING ─────────────────────────────────────────────
[/Script/Engine.WorldPartitionSettings]
bEnableWorldPartition=True
DefaultLoadingRange=15000
HLODLoadingRange=40000
bBlockOnSlowStreaming=False
MaxLoadingRangeScale=2.0

[/Script/Engine.Engine]
bEnableLargeWorldCoordinates=True
NearClipPlane=10.0

; ─── PHYSICS — lightweight for mobile ────────────────────────────────────────
[/Script/Engine.PhysicsSettings]
MaxPhysicsDeltaTime=0.033
bSimulateSkeletalMeshOnDedicatedServer=False
DefaultGravityZ=-980.0
MaxSubstepDeltaTime=0.016
MaxSubsteps=2

; ─── AUDIO — compressed, mobile budget ───────────────────────────────────────
[/Script/Engine.AudioSettings]
MaxChannels=24
NumStoppingSources=8
DefaultAudioQualityLevel=0

; ─── INPUT ───────────────────────────────────────────────────────────────────
[/Script/Engine.InputSettings]
bUseMouseForTouch=False
bAlwaysShowTouchInterface=False
DefaultTouchInterface=/Game/UI/BP_TouchInterface.BP_TouchInterface

; ─── GARBAGE COLLECTION ──────────────────────────────────────────────────────
[/Script/Engine.GarbageCollectionSettings]
gc.MaxObjectsInEditor=2097152
gc.TimeBetweenPurgingPendingKillObjects=60
gc.FlushStreamingOnGC=1

; ─── TEXTURE COMPRESSION ─────────────────────────────────────────────────────
[/Script/UnrealEd.CookerSettings]
cook.EnableNetworkFileServer=0

[/Script/Engine.TextureStreamingSettings]
PoolSize=512
