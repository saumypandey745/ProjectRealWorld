; ==============================================================================
; Project RealWorld - Android Platform Engine Configuration
; Mobile rendering profile tailored for Vulkan Mobile / ES 3.2
; ==============================================================================

[PlatformCrypto]
PlatformSymbol=Android

[/Script/Engine.RendererSettings]
; --- Mobile Geometry & Lighting ---
r.Nanite=0
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Lumen.DiffuseIndirect.Allow=0
r.Shadow.Virtual.Enable=0
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.DistanceFieldShadowing=0
r.DistanceFieldAO=0

; --- Mobile Shading & Anti-Aliasing ---
r.Mobile.EnableMovableLightCSMShaderCulling=1
r.Mobile.EnableNoPrecomputedLightingCSMShader=1
r.MobileHDR=1
r.AntiAliasingMethod=1 ; FXAA / Mobile TAA
r.TemporalAA.Upscaling=0

; --- Mobile Texture Streaming & Memory ---
r.Streaming.PoolSize=600
r.Streaming.LimitPoolSizeToVRAM=1

; --- Particle & Effects Budget ---
r.Niagara.QualityLevel=1
fx.MaxCPUParticlesPerEmitter=300
fx.MaxGPUParticlesSpawnedPerFrame=1000

[/Script/Engine.InputSettings]
bUseMouseForTouch=False
bAlwaysShowTouchInterface=False

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
bBuildForES31=True
bBuildForArm64=True
bBuildForArmV7=False
bSupportsVulkan=True
TargetSDKVersion=34
MinSDKVersion=26
Orientation=Landscape
