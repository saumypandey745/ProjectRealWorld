; ==============================================================================
; Project RealWorld — Android Platform Engine Configuration
; GTA5-class Vulkan Mobile Rendering Pipeline
; Target Hardware: Snapdragon 8 Gen 2+ / Dimensity 9300 / 6GB+ RAM
; Graphics API: Vulkan (mandatory for Nanite + Lumen + VSM)
; ==============================================================================

[PlatformCrypto]
PlatformSymbol=Android

[/Script/Engine.RendererSettings]
; ── Nanite Virtualized Geometry (Vulkan SM5, UE5.4+) ─────────────────────────
r.Nanite=1
r.Nanite.ProjectSelectedMeshes=1
r.Nanite.AllowMeshShaders=1

; ── Lumen Global Illumination (Software Ray Tracing — mobile friendly) ────────
r.DynamicGlobalIlluminationMethod=1
r.Lumen.HardwareRayTracing=0
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.HardwareRayTracing=0
r.Lumen.DiffuseIndirect.MaxTraceDistance=20000

; ── Virtual Shadow Maps ───────────────────────────────────────────────────────
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.Cache.MaxPageAge=32
r.Shadow.Virtual.MaxPhysicalPages=1024
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=2048

; ── Distance Fields (for Lumen SSGI) ─────────────────────────────────────────
r.GenerateMeshDistanceFields=1
r.DistanceFieldShadowing=1
r.DistanceFieldAO=1
r.DistanceFieldAO.NormalOffsetScale=0.0

; ── Mobile Shading ────────────────────────────────────────────────────────────
r.MobileHDR=1
r.Mobile.EnableMovableLightCSMShaderCulling=1
r.Mobile.EnableNoPrecomputedLightingCSMShader=1

; ── Temporal Super Resolution (TSR Upscaling) ────────────────────────────────
r.AntiAliasingMethod=4
r.TemporalAA.Upscaling=1
r.TSR.History.ScreenPercentage=75
r.TSR.ShadingRejection.Flickering=1
r.ScreenPercentage=80

; ── Reflection ────────────────────────────────────────────────────────────────
r.ReflectionMethod=1
r.ReflectionCaptureResolution=256
r.SSR.Quality=2

; ── Post Processing ───────────────────────────────────────────────────────────
r.BloomQuality=3
r.MotionBlurQuality=1
r.AmbientOcclusionLevels=1
r.DepthOfFieldQuality=1
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.AutoExposure.Method=1

; ── Hair Strands (disabled for perf budget on mobile) ────────────────────────
r.HairStrands.Enable=0

; ── Skin & GPU Particles ──────────────────────────────────────────────────────
r.SkinCache.CompileShaders=1
r.Niagara.QualityLevel=1
fx.MaxCPUParticlesPerEmitter=300
fx.MaxGPUParticlesSpawnedPerFrame=1200

; ── Texture & Streaming ───────────────────────────────────────────────────────
r.Streaming.PoolSize=768
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.TextureQuality=2

; ── View Distance ─────────────────────────────────────────────────────────────
r.ViewDistanceScale=0.8
foliage.DensityScale=0.5
r.StaticMeshLODDistanceScale=1.0

[/Script/Engine.InputSettings]
bUseMouseForTouch=False
bAlwaysShowTouchInterface=False
DefaultTouchInterface=/Game/UI/BP_TouchInterface.BP_TouchInterface

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; ── Build Target ──────────────────────────────────────────────────────────────
bBuildForES31=False
bBuildForArm64=True
bBuildForArmV7=False
bBuildForX8664=False
bSupportsVulkan=True
bSupportsVulkanSM5=True
bSupportOpenGLES31=False
PreferredGraphicsAPI=Vulkan

; ── SDK ───────────────────────────────────────────────────────────────────────
TargetSDKVersion=34
MinSDKVersion=30

; ── Device Requirements ───────────────────────────────────────────────────────
Orientation=Landscape
bUseDisplayCutout=True
MaxAspectRatio=2.5
MinimumRequiredMemory=4096

; ── App Info ──────────────────────────────────────────────────────────────────
PackageName=com.projectrealworld.game
ApplicationDisplayName=Project RealWorld
VersionDisplayName=0.1.0
StoreVersion=1

[/Script/Engine.WorldPartitionSettings]
bEnableWorldPartition=True
DefaultLoadingRange=20000
HLODLoadingRange=50000
bBlockOnSlowStreaming=False

[/Script/Engine.Engine]
bEnableLargeWorldCoordinates=True
