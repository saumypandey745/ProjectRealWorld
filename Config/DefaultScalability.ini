; ==============================================================================
; Project RealWorld - Scalability Profiles
; Supports lightweight development on low-end hardware (Intel HD iGPU)
; through high-end AAA production tiers (RTX 4090 / Nanite / Lumen / VSM).
; ==============================================================================

; ------------------------------------------------------------------------------
; 1. VIEW DISTANCE QUALITY
; ------------------------------------------------------------------------------
[ViewDistanceQuality@0] ; Development Low (Intel HD 2500 fallback)
r.ViewDistanceScale=0.6
foliage.DensityScale=0.3
r.StaticMeshLODDistanceScale=1.4

[ViewDistanceQuality@1] ; Development Medium
r.ViewDistanceScale=0.8
foliage.DensityScale=0.6
r.StaticMeshLODDistanceScale=1.1

[ViewDistanceQuality@2] ; Production High
r.ViewDistanceScale=1.0
foliage.DensityScale=0.8
r.StaticMeshLODDistanceScale=1.0

[ViewDistanceQuality@3] ; Production Epic
r.ViewDistanceScale=1.3
foliage.DensityScale=1.0
r.StaticMeshLODDistanceScale=0.8

[ViewDistanceQuality@Cine] ; Production Cinematic
r.ViewDistanceScale=2.0
foliage.DensityScale=1.5
r.StaticMeshLODDistanceScale=0.5

; ------------------------------------------------------------------------------
; 2. ANTI-ALIASING QUALITY
; ------------------------------------------------------------------------------
[AntiAliasingQuality@0] ; Development Low
r.AntiAliasingMethod=1 ; FXAA
r.TemporalAA.Upscaling=0

[AntiAliasingQuality@1] ; Development Medium
r.AntiAliasingMethod=2 ; TAA
r.TemporalAA.Upscaling=1

[AntiAliasingQuality@2] ; Production High
r.AntiAliasingMethod=2 ; TSR Standard
r.TSR.History.ScreenPercentage=100

[AntiAliasingQuality@3] ; Production Epic
r.AntiAliasingMethod=2 ; TSR High Quality
r.TSR.History.ScreenPercentage=100
r.TSR.ShadingRejection.Flickering=1

[AntiAliasingQuality@Cine] ; Production Cinematic
r.AntiAliasingMethod=2 ; TSR Cinematic Super-Sampling
r.TSR.History.ScreenPercentage=150

; ------------------------------------------------------------------------------
; 3. SHADOW QUALITY
; ------------------------------------------------------------------------------
[ShadowQuality@0] ; Development Low
r.ShadowQuality=1
r.Shadow.Virtual.Enable=0
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=1024
r.DistanceFieldShadowing=0

[ShadowQuality@1] ; Development Medium
r.ShadowQuality=2
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5
r.DistanceFieldShadowing=1

[ShadowQuality@2] ; Production High
r.ShadowQuality=4
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.DistanceFieldShadowing=1

[ShadowQuality@3] ; Production Epic
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.DistanceFieldShadowing=1

[ShadowQuality@Cine] ; Production Cinematic
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
r.Shadow.Virtual.ClipmapLodBias=-1
r.DistanceFieldShadowing=1

; ------------------------------------------------------------------------------
; 4. GLOBAL ILLUMINATION & REFLECTIONS
; ------------------------------------------------------------------------------
[GlobalIlluminationQuality@0] ; Development Low
r.DynamicGlobalIlluminationMethod=0 ; Screen Space / Off
r.ReflectionMethod=0 ; Screen Space / Low
r.DistanceFieldAO=0

[GlobalIlluminationQuality@1] ; Development Medium
r.DynamicGlobalIlluminationMethod=1 ; Software Lumen
r.ReflectionMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.RadianceCache.GridResolution=32
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@2] ; Production High
r.DynamicGlobalIlluminationMethod=1 ; Software Lumen High
r.ReflectionMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.RadianceCache.GridResolution=64
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@3] ; Production Epic
r.DynamicGlobalIlluminationMethod=1 ; Software/Hardware Lumen Epic
r.ReflectionMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.RadianceCache.GridResolution=64
r.Lumen.ScreenProbeGather.ScreenTraces=1

[GlobalIlluminationQuality@Cine] ; Production Cinematic
r.DynamicGlobalIlluminationMethod=1 ; Full Hardware Raytracing Lumen
r.ReflectionMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.RadianceCache.GridResolution=128
r.Lumen.ScreenProbeGather.ScreenTraces=1
r.Lumen.HardwareRayTracing=1

; ------------------------------------------------------------------------------
; 5. EFFECTS QUALITY (Niagara & Particles)
; ------------------------------------------------------------------------------
[EffectsQuality@0] ; Development Low
r.Niagara.QualityLevel=0
fx.MaxCPUParticlesPerEmitter=100
fx.MaxGPUParticlesSpawnedPerFrame=500

[EffectsQuality@1] ; Development Medium
r.Niagara.QualityLevel=1
fx.MaxCPUParticlesPerEmitter=500
fx.MaxGPUParticlesSpawnedPerFrame=2000

[EffectsQuality@2] ; Production High
r.Niagara.QualityLevel=2
fx.MaxCPUParticlesPerEmitter=1000
fx.MaxGPUParticlesSpawnedPerFrame=5000

[EffectsQuality@3] ; Production Epic
r.Niagara.QualityLevel=3
fx.MaxCPUParticlesPerEmitter=2000
fx.MaxGPUParticlesSpawnedPerFrame=10000

[EffectsQuality@Cine] ; Production Cinematic
r.Niagara.QualityLevel=4
fx.MaxCPUParticlesPerEmitter=5000
fx.MaxGPUParticlesSpawnedPerFrame=25000

; ------------------------------------------------------------------------------
; 6. POST PROCESSING QUALITY
; ------------------------------------------------------------------------------
[PostProcessQuality@0] ; Development Low
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.DepthOfFieldQuality=0
r.BloomQuality=1

[PostProcessQuality@1] ; Development Medium
r.MotionBlurQuality=1
r.AmbientOcclusionLevels=1
r.DepthOfFieldQuality=1
r.BloomQuality=2

[PostProcessQuality@2] ; Production High
r.MotionBlurQuality=2
r.AmbientOcclusionLevels=2
r.DepthOfFieldQuality=2
r.BloomQuality=3

[PostProcessQuality@3] ; Production Epic
r.MotionBlurQuality=3
r.AmbientOcclusionLevels=3
r.DepthOfFieldQuality=3
r.BloomQuality=4

[PostProcessQuality@Cine] ; Production Cinematic
r.MotionBlurQuality=4
r.AmbientOcclusionLevels=4
r.DepthOfFieldQuality=4
r.BloomQuality=5
