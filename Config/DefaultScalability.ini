; ==============================================================================
; Project RealWorld — Android Mobile Scalability Profiles (Default)
; Scalability 0 = Mobile Low (4GB RAM, 64GB storage, Snapdragon 680/695) — 30fps
; Scalability 1 = Mobile Medium (6GB RAM, Snapdragon 7xx / Dimensity 7000) — 45fps
; Scalability 2 = Mobile High (8GB RAM, Snapdragon 870/8 Gen 1) — 60fps
; Scalability 3 = Mobile Ultra (Flagship, Snapdragon 8 Gen 2/3) — 60fps max fidelity
; ==============================================================================

