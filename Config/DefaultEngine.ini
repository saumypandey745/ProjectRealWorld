+ActiveGameNameRedirects=(OldGameName="/Script/TP_ThirdPerson",NewGameName="/Script/ProjectRealWorld")
bEnableLargeWorldCoordinates=True

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/L_WorldPartition_City.L_WorldPartition_City
GameDefaultMap=/Game/Maps/L_WorldPartition_City.L_WorldPartition_City
GlobalDefaultGameMode=/Script/ProjectRealWorld.RealWorldGameMode

[/Script/Engine.RendererSettings]
; --- Nanite Geometry Pipeline ---
r.Nanite=1
r.Nanite.ProjectSelectedMeshes=1
r.Nanite.MaxNodesPerFrame=2097152
r.Nanite.MaxVisibleClusters=4194304

; --- Lumen Global Illumination & Reflections ---
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.HardwareRayTracing=0
r.ReflectionMethod=1
r.Lumen.Reflections.HardwareRayTracing=0

; --- Virtual Shadow Maps (VSM) ---
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.Cache.MaxPageAge=64
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5

; --- High Fidelity Post Processing & Anti-Aliasing ---
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.AutoExposure.Method=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=1
r.DefaultFeature.MotionBlur=1
r.DefaultFeature.AntiAliasing=2
r.TemporalAA.Upscaling=1
r.TSR.ShadingRejection.Flickering=1

; --- Skin, Groom & Mesh Shaders ---
r.SkinCache.CompileShaders=1
r.HairStrands.Enable=1
r.GenerateMeshDistanceFields=1

[/Script/Engine.WorldPartitionSettings]
bEnableWorldPartition=True
