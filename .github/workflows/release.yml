name: CD - Automated Release & Deployment

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Project RealWorld Production Release'
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Deploy Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Target Release Version: ${VERSION}"

      - name: Prepare Clean Distribution Package
        run: |
          echo "==> Creating clean distribution bundle..."
          ARCHIVE_NAME="ProjectRealWorld-${{ env.VERSION }}"
          STAGING_DIR="/tmp/${ARCHIVE_NAME}"
          mkdir -p "${STAGING_DIR}"

          # Copy core project files excluding binaries, intermediate, and git tracking
          rsync -av --progress ./ "${STAGING_DIR}/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'Binaries' \
            --exclude 'Intermediate' \
            --exclude 'Saved' \
            --exclude 'DerivedDataCache' \
            --exclude '.vs' \
            --exclude '.idea' \
            --exclude '*.code-workspace'

          # Create distribution zip and tar.gz
          cd /tmp
          zip -r -9 "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}-Source.zip" "${ARCHIVE_NAME}"
          tar -czvf "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}-Source.tar.gz" "${ARCHIVE_NAME}"
          cd "${GITHUB_WORKSPACE}"

          # Compute SHA256 checksums
          sha256sum "${ARCHIVE_NAME}-Source.zip" "${ARCHIVE_NAME}-Source.tar.gz" > "checksums-${{ env.VERSION }}.sha256"
          cat "checksums-${{ env.VERSION }}.sha256"

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌆 Project RealWorld - Release ${{ env.VERSION }}

          ### 🚀 What's New
          - **AAA Open World Systems Architecture** in Unreal Engine 5.4+
          - **Chaos Vehicle Physics**: Drivetrain, gears, fuel, 7-tier damage states
          - **AI Crowd & Traffic**: Multi-lane traffic lights, 8 NPC archetypes with schedule management
          - **Crime & Wanted System**: 0–5 star wanted levels, LoS witnessing, pursuit AI
          - **Cross-Platform Scalability**: Dynamic hardware detection (PC Nanite/Lumen → Mobile Vulkan ARM64)
          - **Mission System**: Vertical slice "Late Delivery" with 10 sequential objectives

          ### 📦 Distribution Assets
          | Artifact | Description |
          |---|---|
          | \`ProjectRealWorld-${{ env.VERSION }}-Source.zip\` | Complete Unreal Engine 5.4 project source & configs (ZIP) |
          | \`ProjectRealWorld-${{ env.VERSION }}-Source.tar.gz\` | Complete Unreal Engine 5.4 project source & configs (TAR.GZ) |
          | \`checksums-${{ env.VERSION }}.sha256\` | SHA-256 integrity checksums |

          ### 🛠️ Quick Start Instructions
          \`\`\`bash
          # 1. Unzip distribution
          unzip ProjectRealWorld-${{ env.VERSION }}-Source.zip
          cd ProjectRealWorld-${{ env.VERSION }}

          # 2. Generate project files with your Unreal Engine 5.4 installation
          /path/to/UnrealEngine/Engine/Build/BatchFiles/Linux/GenerateProjectFiles.sh \
              -project="$(pwd)/ProjectRealWorld.uproject" -game -engine
          \`\`\`

          ---
          *Automated release generated by Antigravity CI/CD Pipeline.*
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ github.event.inputs.release_title || format('Project RealWorld {0}', env.VERSION) }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          files: |
            ProjectRealWorld-${{ env.VERSION }}-Source.zip
            ProjectRealWorld-${{ env.VERSION }}-Source.tar.gz
            checksums-${{ env.VERSION }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
