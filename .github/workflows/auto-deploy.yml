name: CD - Live Auto Deploy (PC & Mobile)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.ignore'
  workflow_dispatch:

concurrency:
  group: live-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy-live:
    name: Build & Deploy Live Packages (PC + Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Integrity & Cross-Platform Configs
        run: |
          echo "==> Validating project integrity..."
          python3 -c "
          import json, glob, os
          with open('ProjectRealWorld.uproject') as f:
              data = json.load(f)
          assert 'FileVersion' in data and len(data['Modules']) > 0
          print('✓ Project descriptor valid.')
          "

      - name: Package Multi-Platform Live Distributions
        run: |
          echo "==> Creating Live distribution packages for PC and Mobile..."
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV

          DIST_DIR="/tmp/dist"
          mkdir -p "${DIST_DIR}/pc" "${DIST_DIR}/android" "${DIST_DIR}/universal"

          # Base exclusions
          EXCLUDES=(
            --exclude '.git'
            --exclude '.github'
            --exclude 'Binaries'
            --exclude 'Intermediate'
            --exclude 'Saved'
            --exclude 'DerivedDataCache'
            --exclude '.vs'
            --exclude '.idea'
            --exclude '*.code-workspace'
          )

          # 1. PC Package
          rsync -av ./ "${DIST_DIR}/pc/ProjectRealWorld-PC/" "${EXCLUDES[@]}" --exclude 'Config/Android' --exclude 'Config/IOS'
          cd "${DIST_DIR}/pc"
          zip -r -9 "${GITHUB_WORKSPACE}/ProjectRealWorld-PC-Live.zip" "ProjectRealWorld-PC"
          cd "${GITHUB_WORKSPACE}"

          # 2. Android Mobile Package
          rsync -av ./ "${DIST_DIR}/android/ProjectRealWorld-Android/" "${EXCLUDES[@]}" --exclude 'Config/IOS'
          cd "${DIST_DIR}/android"
          zip -r -9 "${GITHUB_WORKSPACE}/ProjectRealWorld-Android-Live.zip" "ProjectRealWorld-Android"
          cd "${GITHUB_WORKSPACE}"

          # 3. Universal Full Package
          rsync -av ./ "${DIST_DIR}/universal/ProjectRealWorld-Universal/" "${EXCLUDES[@]}"
          cd "${DIST_DIR}/universal"
          zip -r -9 "${GITHUB_WORKSPACE}/ProjectRealWorld-Universal-Live.zip" "ProjectRealWorld-Universal"
          tar -czvf "${GITHUB_WORKSPACE}/ProjectRealWorld-Universal-Live.tar.gz" "ProjectRealWorld-Universal"
          cd "${GITHUB_WORKSPACE}"

          # 4. SHA256 Checksums
          sha256sum \
            ProjectRealWorld-PC-Live.zip \
            ProjectRealWorld-Android-Live.zip \
            ProjectRealWorld-Universal-Live.zip \
            ProjectRealWorld-Universal-Live.tar.gz > checksums-live.sha256

          cat checksums-live.sha256

      - name: Generate Live Release Notes
        run: |
          cat << EOF > live_notes.md
          ## 🌆 Project RealWorld - Live Rolling Release (Auto-Deployed)

          > [!NOTE]
          > **Live Continuous Deployment**: Ye release \`main\` branch par kisi bhi code push ke saath automatically update hota hai.
          > **Latest Commit**: \`${{ env.COMMIT_HASH }}\` | **Deployed At**: \`${{ env.BUILD_DATE }}\`

          ---

          ### 📦 Download Packages (PC & Mobile)

          | Platform | Package | Description |
          |---|---|---|
          | 🖥️ **PC (Desktop)** | [\`ProjectRealWorld-PC-Live.zip\`](https://github.com/saumypandey745/ProjectRealWorld/releases/download/live/ProjectRealWorld-PC-Live.zip) | Pre-configured for PC (Nanite, Lumen, 60-120fps PC scalability, Mouse/Keyboard & Gamepad) |
          | 📱 **Android (Mobile)** | [\`ProjectRealWorld-Android-Live.zip\`](https://github.com/saumypandey745/ProjectRealWorld/releases/download/live/ProjectRealWorld-Android-Live.zip) | Pre-configured for Mobile (Vulkan ES3.1, ARM64 target, Mobile scalability, Touch HUD) |
          | 🌐 **Universal (Full)** | [\`ProjectRealWorld-Universal-Live.zip\`](https://github.com/saumypandey745/ProjectRealWorld/releases/download/live/ProjectRealWorld-Universal-Live.zip) | Full cross-platform package with all platform configs |

          ---

          ### 🔍 Integrity Verification
          Checksums for this live deployment:
          \`\`\`
          $(cat checksums-live.sha256)
          \`\`\`

          ### 🚀 How to Play / Test
          1. **PC (Windows / Linux)**: Download \`ProjectRealWorld-PC-Live.zip\`, extract, and open \`ProjectRealWorld.uproject\` in Unreal Engine 5.4+ Editor. Press **Alt + P** to play!
          2. **Mobile (Android)**: Use \`ProjectRealWorld-Android-Live.zip\` with Android Studio SDK (API 34) & NDK r25c to package APK directly.

          ---
          *Continuous Deployment powered by Antigravity CI/CD.*
          EOF

      - name: Publish or Update Live Rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live
          name: "🌆 Project RealWorld - Live Continuous Deployment (PC & Mobile)"
          body_path: live_notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ProjectRealWorld-PC-Live.zip
            ProjectRealWorld-Android-Live.zip
            ProjectRealWorld-Universal-Live.zip
            ProjectRealWorld-Universal-Live.tar.gz
            checksums-live.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
